<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Check - Get Current Weather Anywhere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Check</h1>
            <p class="subtitle">Get current weather conditions for any location</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="weatherCard" class="weather-card hidden">
            <div class="weather-header">
                <h2 id="cityName"></h2>
                <p id="dateTime"></p>
            </div>

            <div class="weather-main">
                <div class="temperature">
                    <span id="temp"></span>
                    <span class="unit">°C</span>
                </div>
                <div class="weather-icon" id="weatherIcon"></div>
                <p id="condition"></p>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="label">Feels Like</span>
                    <span id="feelsLike" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Humidity</span>
                    <span id="humidity" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Wind</span>
                    <span id="wind" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Precipitation</span>
                    <span id="precipitation" class="value"></span>
                </div>
            </div>

            <div class="forecast" id="forecast">
                <h3>7-Day Forecast</h3>
                <div class="forecast-items" id="forecastItems"></div>
            </div>
        </div>

        <footer>
            <p>Powered by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> API</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
